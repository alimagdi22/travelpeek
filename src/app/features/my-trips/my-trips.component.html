<div class="my-trips-page-wrapper d-flex">
  <!-- TravelPeek History Sidebar Component -->
  <app-history-sidebar
    [searchHistory]="searchHistory"
    [isLoggedIn]="isLoggedIn"
    [userInitials]="userInitials"
    [userDisplayName]="userDisplayName"
    [isMobileHistoryOpen]="isMobileHistoryOpen"
    (querySelected)="sendMessage($event)"
    (clearHistory)="clearSearchHistory()"
    (newChatTriggered)="startNewChat()"
    (closeMobileDrawer)="toggleMobileHistory(false)"
  ></app-history-sidebar>

  <!-- Main Chat Window Wrapper -->
  <div class="chat-main-wrapper flex-grow-1 py-5 d-flex align-items-center justify-content-center position-relative">

    <!-- Floating Mobile Sidebar Toggle -->
    <button class="btn btn-light border shadow-sm rounded-circle d-lg-none d-flex align-items-center justify-content-center position-absolute"
            style="top: 20px; left: 20px; width: 40px; height: 40px; z-index: 1000;"
            (click)="toggleMobileHistory()"
            title="Open Search History">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b1a30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div class="container chat-container-v2">

      <!-- Chat Messages Scroll Container -->
      <div class="chat-messages-container d-flex flex-column gap-4 p-4">
        <div
          *ngFor="let msg of messages"
          class="message-row d-flex flex-column"
          [class.user-row]="msg.sender === 'user'"
          [class.system-row]="msg.sender === 'system'"
        >
          <!-- User Chat Bubble -->
          <div
            *ngIf="msg.sender === 'user'"
            class="user-bubble p-3 px-4 rounded-4 shadow-sm"
          >
            <p class="mb-0 text-content">{{ msg.text }}</p>
          </div>

          <!-- System Chat Bubble (With Nested Flight Cards) -->
          @if (msg.sender === "system") {
            <div class="system-bubble-wrapper w-100 d-flex flex-column gap-2 align-items-start">
              @if (msg.text) {
                <div class="system-text-bubble p-3 px-4 rounded-4 shadow-sm">
                  <p class="mb-0 system-intro-text">{{ msg.text }}</p>
                </div>
              }

              <!-- Flight Results Cards -->
              @if (msg.itineraries && msg.itineraries.length > 0) {
                <div class="system-bubble p-1 rounded-4 w-100">
                  <app-available-flights
                    [itineraries]="msg.itineraries.slice(0, 5)"
                  ></app-available-flights>
                </div>
              }
            </div>
          }
        </div>

        <!-- Pulse Typing Indicator for AI Reply -->
        @if (flightResultService.loading) {
          <div
            class="message-row system-row d-flex flex-column align-items-start"
          >
            <div
              class="system-typing-bubble p-3 px-4 rounded-4 d-flex align-items-center gap-1"
            >
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        }
      </div>

      <!-- Suggestion Action Pills Row (Slider / Swiper in Mobile) -->
      <div
        *ngIf="messages.length > 0 && suggestions.length > 0"
        class="suggestions-slider-wrapper position-relative w-100 mb-3 mt-3"
      >
        <div
          class="suggestions-row-v2 d-flex flex-wrap justify-content-center gap-2 px-4"
          #suggestionsSlider
        >
          <button
            *ngFor="let sug of suggestions"
            class="suggestion-btn-v2 suggestion-slider-item"
            (click)="selectSuggestion(sug)"
          >
            {{ sug }}
          </button>
        </div>

        <!-- Floating Slider Navigation Arrows (Mobile only) -->
        <!-- <button class="suggestions-arrow-btn prev d-md-none" (click)="scrollSuggestions(suggestionsSlider, 'left')" aria-label="Previous suggestions">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <button class="suggestions-arrow-btn next d-md-none" (click)="scrollSuggestions(suggestionsSlider, 'right')" aria-label="Next suggestions">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button> -->
      </div>

      <!-- Chat Input Controls Container -->
      <div class="chat-input-bar-container px-4 pb-4">
        <div class="d-flex align-items-center gap-3">
          <!-- New Chat Button -->
          <button
            class="btn-new-chat-circle border-0 d-flex align-items-center justify-content-center rounded-circle"
            (click)="startNewChat()"
            title="Start New Chat"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>

          <!-- Input Bar -->
          <div
            class="chat-input-bar-v2 d-flex align-items-center p-2 rounded-5 shadow-sm bg-white flex-grow-1"
          >
            <!-- Sparkle Prompt Icon (Left) -->
            <div
              class="sparkle-prompt-box d-flex align-items-center justify-content-center ms-2"
            >
              <img
                src="/assets/icons/home/hero-section/stars.svg"
                class="stars-svg-chat"
                alt="AI Icon"
              />
            </div>

            <!-- Input Textarea (Responsive to full text on mobile) -->
            <textarea
              class="chat-input-field-v2 flex-grow-1 border-0 bg-transparent px-3 py-1 align-self-center"
              placeholder="Type traveler names or ask about baggage..."
              [(ngModel)]="newMessage"
              (keydown)="onInputKeydown($event)"
              (input)="adjustTextareaHeight($event.target)"
              rows="1"
              style="resize: none; max-height: 120px; height: auto;"
            ></textarea>

            <!-- Attachment Paperclip -->
            <button
              class="attachment-btn-v2 d-flex align-items-center justify-content-center p-2 bg-transparent border-0 me-2"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#6C757D"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                />
              </svg>
            </button>

            <!-- Send Circle Button -->
            <button
              class="send-btn-v2 d-flex align-items-center justify-content-center border-0 rounded-circle"
              (click)="sendMessage(newMessage)"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="19" x2="12" y2="5" />
                <polyline points="5 12 12 5 19 12" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
