<div class="my-trips-page-wrapper py-5">
  <div class="container chat-container-v2">
    <!-- Chat Messages Scroll Container -->
    <div class="chat-messages-container d-flex flex-column gap-4 p-4">
      <div *ngFor="let msg of messages" class="message-row d-flex flex-column" [class.user-row]="msg.sender === 'user'" [class.system-row]="msg.sender === 'system'">
        
        <!-- User Chat Bubble -->
        <div *ngIf="msg.sender === 'user'" class="user-bubble p-3 px-4 rounded-4 shadow-sm">
          <p class="mb-0 text-content">{{ msg.text }}</p>
        </div>

        <!-- System Chat Bubble (With Nested Flight Cards) -->
        <div *ngIf="msg.sender === 'system'" class="system-bubble-wrapper w-100">
          <div class="system-bubble p-4 rounded-4">
            <!-- Text Description -->
            <p class="system-intro-text mb-4">{{ msg.text }}</p>

            <!-- Flight Results Cards -->
            <div *ngIf="msg.flights && msg.flights.length > 0" class="flight-cards-list d-flex flex-column gap-3">
              <div *ngFor="let flight of msg.flights" class="flight-card-v2 p-4 rounded-3 shadow-sm bg-white">
                
                <!-- Airline Header Row -->
                <div class="row align-items-center justify-content-between g-2 mb-3">
                  <div class="col-auto d-flex align-items-center gap-2">
                    <!-- Square Blue Icon with White Plane SVG -->
                    <div class="airline-icon-box d-flex align-items-center justify-content-center">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 16V14.5L13 9.5V3.5C13 2.67 12.33 2 11.5 2C10.67 2 10 2.67 10 3.5V9.5L2 14.5V16L10 13.5V19L8 20.5V22L11.5 21L15 22V20.5L13 19V13.5L21 16Z" fill="#004AC6"/>
                      </svg>
                    </div>
                    <span class="airline-name">{{ flight.airline }}</span>
                  </div>
                  <div *ngIf="flight.badge" class="col-auto">
                    <span class="badge-v2" [class]="flight.badgeClass">{{ flight.badge }}</span>
                  </div>
                </div>

                <!-- Timeline / Connection Row -->
                <div class="row align-items-center justify-content-between g-3 mb-3">
                  <!-- Departure -->
                  <div class="col-auto text-start">
                    <div class="flight-time">{{ flight.depTime }}</div>
                    <div class="airport-code">{{ flight.depCode }}</div>
                  </div>

                  <!-- Timeline Graphics -->
                  <div class="col px-3 d-flex flex-column align-items-center justify-content-center position-relative">
                    <span class="timeline-duration mb-1">{{ flight.duration }}</span>
                    <!-- Connecting line with solid circle on the right -->
                    <div class="timeline-graphic-v2 w-100 d-flex align-items-center position-relative">
                      <div class="line-v2 w-100"></div>
                      <div class="circle-indicator-v2"></div>
                    </div>
                    <span class="timeline-stops mt-1">{{ flight.stops }}</span>
                  </div>

                  <!-- Arrival -->
                  <div class="col-auto text-end">
                    <div class="flight-time">{{ flight.arrTime }}</div>
                    <div class="airport-code">{{ flight.arrCode }}</div>
                  </div>
                </div>

                <hr class="card-divider-v2 my-3" />

                <!-- Card Footer Row -->
                <div class="row align-items-center justify-content-between g-2">
                  <div class="col-auto">
                    <span class="cabin-class text-uppercase">Economy Class</span>
                  </div>
                  <div class="col-auto">
                    <span class="flight-price">{{ flight.price }}</span>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Pulse Typing Indicator for AI Reply -->
      <div *ngIf="isTyping" class="message-row system-row d-flex flex-column align-items-start">
        <div class="system-typing-bubble p-3 px-4 rounded-4 d-flex align-items-center gap-1">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>

    <!-- Suggestion Action Pills Row -->
    <div *ngIf="messages.length > 0 && suggestions.length > 0" class="suggestions-row-v2 d-flex flex-wrap justify-content-center gap-2 px-4 mb-3">
      <button *ngFor="let sug of suggestions" class="suggestion-btn-v2" (click)="selectSuggestion(sug)">
        {{ sug }}
      </button>
    </div>

    <!-- Chat Input Controls Container -->
    <div class="chat-input-bar-container px-4 pb-4">
      <div class="chat-input-bar-v2 d-flex align-items-center p-2 rounded-5 shadow-sm bg-white">
        <!-- Sparkle Prompt Icon (Left) -->
        <div class="sparkle-prompt-box d-flex align-items-center justify-content-center ms-2">
          <img src="/assets/icons/home/hero-section/stars.svg" class="stars-svg-chat" alt="AI Icon" />
        </div>

        <!-- Input Text -->
        <input 
          type="text" 
          class="chat-input-field-v2 flex-grow-1 border-0 bg-transparent px-3" 
          placeholder="Type traveler names or ask about baggage..."
          [(ngModel)]="newMessage"
          (keydown.enter)="sendMessage(newMessage)" />

        <!-- Attachment Paperclip -->
        <button class="attachment-btn-v2 d-flex align-items-center justify-content-center p-2 bg-transparent border-0 me-2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6C757D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>

        <!-- Send Circle Button -->
        <button class="send-btn-v2 d-flex align-items-center justify-content-center border-0 rounded-circle" (click)="sendMessage(newMessage)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
