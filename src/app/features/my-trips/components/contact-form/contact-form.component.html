<div class="inline-contact-card mt-2 w-100">
  <div class="card-header-v2 d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
    <div class="header-icon-circle d-flex align-items-center justify-content-center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#004ac6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
      </svg>
    </div>
    <div>
      <h6 class="mb-0 font-bold text-dark-title">Contact Details</h6>
      <span class="text-xs text-muted">Please provide your contact information to proceed</span>
    </div>
  </div>

  <form [formGroup]="contactForm" class="d-flex flex-column gap-3">
    <!-- Phone Input with ngx-intl-tel-input -->
    <div class="form-group d-flex flex-column gap-1">
      <label class="form-label text-xs text-secondary font-semibold mb-1">Phone Number <span class="text-danger">*</span></label>
      <ngx-intl-tel-input
        name="phone"
        [cssClass]="isPhoneInvalid ? 'form-control is-invalid custom-phone-input' : 'form-control custom-phone-input'"
        [preferredCountries]="preferredCountries"
        [enableAutoCountrySelect]="true"
        [enablePlaceholder]="true"
        [searchCountryFlag]="true"
        [searchCountryPlaceholder]="'Search country name or code'"
        [searchCountryField]="[SearchCountryField.All]"
        [selectedCountryISO]="CountryISO.Egypt"
        formControlName="phone"
        (input)="checkAndSubmitWithDebounce()"
        (countryChange)="checkAndSubmitWithDebounce()"
      >
      </ngx-intl-tel-input>
      <span *ngIf="isPhoneInvalid" class="text-xs text-danger mt-1 font-medium">Please enter a valid phone number.</span>
    </div>

    <!-- Email Input -->
    <div class="form-group d-flex flex-column gap-1">
      <label class="form-label text-xs text-secondary font-semibold mb-1">Email Address <span class="text-danger">*</span></label>
      <div class="input-group-custom d-flex align-items-center px-3 py-2 rounded-3 border" [class.border-danger]="isEmailInvalid">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6c757d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2 text-icon">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <input
          type="email"
          class="border-0 bg-transparent flex-grow-1 outline-none text-sm text-dark font-medium"
          placeholder="e.g. user@example.com"
          formControlName="email"
          (input)="checkAndSubmitWithDebounce()"
        />
      </div>
      <span *ngIf="isEmailInvalid" class="text-xs text-danger mt-1 font-medium">Please enter a valid email address.</span>
    </div>
  </form>
</div>
