<!-- ── Desktop Sidebar (Collapsible Style) ── -->
<div class="sidebar-v2 d-none d-lg-flex flex-column border-end" [class.collapsed]="isSidebarCollapsed">
  <!-- Top Row: Collapsed toggle, or Title + Toggle -->
  <div class="sidebar-header d-flex align-items-center justify-content-between border-bottom">
    <!-- <span class="panel-title mb-0" *ngIf="!isSidebarCollapsed">
      TravelPeek
    </span> -->
    @if(!isSidebarCollapsed){
      <img src="assets/images/logo.png" alt="travelpeek" routerLink="/">
    }
    <button class="btn-sidebar-toggle border-0 bg-transparent p-1" (click)="toggleSidebar()" [title]="isSidebarCollapsed ? 'Open sidebar' : 'Close sidebar'">
      <!-- ChatGPT Style Layout Icon -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6c757d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [style.transform]="isSidebarCollapsed ? 'rotate(180deg)' : 'none'">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
    </button>
  </div>

  <!-- Sidebar Navigation Actions & History List -->
  <div class="sidebar-content flex-grow-1 overflow-y-auto px-3 d-flex flex-column">
    <!-- Expanded State Content -->
    <ng-container *ngIf="!isSidebarCollapsed">
      <!-- New Chat Button -->
      <button class="btn-new-chat-sidebar d-flex align-items-center gap-2 w-100 border-0 text-start px-3 py-2 rounded-3 mb-3 mt-3" (click)="onNewChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"></path>
        </svg>
        <span>New chat</span>
      </button>

      <!-- Recents Search History Section -->
      <div class="d-flex justify-content-between align-items-center mb-2 px-2 mt-2">
        <span class="text-xs font-semibold text-uppercase tracking-wider text-muted">Recents</span>
      </div>

      <!-- History Items -->
      <ng-container *ngIf="isLoggedIn; else loginPromptDesktop">
        <!-- Skeleton Loader -->
        <div *ngIf="flightResultService.searchHistoryLoading" class="skeleton-loader py-2">
          <div *ngFor="let i of [1, 2, 3, 4, 5]" class="skeleton-item">
            <div class="skeleton-bar"></div>
          </div>
        </div>

        <!-- Error message -->
        <div *ngIf="!flightResultService.searchHistoryLoading && flightResultService.searchHistoryError" class="sidebar-error text-center py-4 px-2">
          <p class="text-xs text-danger mb-0">Failed to load history</p>
          <button class="btn btn-xs btn-link p-0 text-decoration-none mt-1" style="font-size: 11px;" (click)="flightResultService.getSearchHistory()">
            Retry
          </button>
        </div>

        <!-- Empty state -->
        <div *ngIf="!flightResultService.searchHistoryLoading && !flightResultService.searchHistoryError && searchHistory.length === 0" class="text-center py-4 text-muted text-sm">
          No recent searches.
        </div>

        <!-- History items -->
        <div *ngIf="!flightResultService.searchHistoryLoading && !flightResultService.searchHistoryError && searchHistory.length > 0" class="d-flex flex-column gap-1">
          <button *ngFor="let item of searchHistory" class="history-item-btn border-0 text-start px-3 py-2 rounded-3 text-truncate" (click)="onSelectQuery(item)" [title]="item.title || item">
            {{ item.title || item }}
          </button>
        </div>
      </ng-container>

      <!-- Logged out prompt -->
      <ng-template #loginPromptDesktop>
        <div class="login-prompt-box-sidebar text-center py-4 px-3 rounded-3 mt-3">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#004AC6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <h4 class="search-history-text font-bold text-dark mb-1">View Search History</h4>
          <p class="login-text text-xxs text-muted mb-3">Log in to save and view your recent searches.</p>
          <button class="btn btn-sm btn-primary w-100 font-semibold py-1" routerLink="/login">
            Log In
          </button>
        </div>
      </ng-template>
    </ng-container>

    <!-- Collapsed State Content -->
    <ng-container *ngIf="isSidebarCollapsed">
      <div class="d-flex flex-column align-items-center gap-3 py-3 mt-2">
        <!-- New Chat Icon -->
        <button class="collapsed-action-btn rounded-circle d-flex align-items-center justify-content-center border-0" (click)="onNewChat()" title="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"></path>
          </svg>
        </button>

        <!-- History shortcut or login icon -->
        <ng-container *ngIf="isLoggedIn; else loginIconCollapsed">
          <!-- Small Spinner for loading state -->
          <div *ngIf="flightResultService.searchHistoryLoading" class="spinner-border spinner-border-sm text-primary" role="status" style="width: 1rem; height: 1rem;">
            <span class="visually-hidden">Loading...</span>
          </div>

          <!-- Error retry icon -->
          <button *ngIf="!flightResultService.searchHistoryLoading && flightResultService.searchHistoryError" class="collapsed-history-btn rounded-circle d-flex align-items-center justify-content-center border-0 text-danger" (click)="flightResultService.getSearchHistory()" title="Failed to load history. Click to retry.">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </button>

          <!-- Magnifying glass / search shortcuts representation -->
          <ng-container *ngIf="!flightResultService.searchHistoryLoading && !flightResultService.searchHistoryError">
            <button *ngFor="let item of searchHistory.slice(0, 5)" class="collapsed-history-btn rounded-circle d-flex align-items-center justify-content-center border-0" (click)="onSelectQuery(item)" [title]="item.title || item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </ng-container>
        </ng-container>
        <ng-template #loginIconCollapsed>
          <button class="collapsed-action-btn rounded-circle d-flex align-items-center justify-content-center border-0" routerLink="/login" title="Log in to view history">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </button>
        </ng-template>
      </div>
    </ng-container>
  </div>

  <!-- Bottom Row: User Profile / Sign Out -->
  <div class="sidebar-footer p-3 border-top bg-light">
    <!-- Expanded State Profile -->
    <div class="d-flex align-items-center gap-2 w-100" *ngIf="!isSidebarCollapsed">
      <div class="user-avatar rounded-circle d-flex align-items-center justify-content-center text-xs font-bold text-white bg-primary">
        {{ userInitials }}
      </div>
      <div class="user-info flex-grow-1 overflow-hidden">
        <div class="user-name text-sm font-semibold text-dark text-truncate">{{ userDisplayName }}</div>
        <div class="user-plan text-xxs text-muted">Free</div>
      </div>
      <button *ngIf="isLoggedIn" class="btn-logout-sidebar border-0 bg-transparent p-1 text-muted" routerLink="/login" title="Account / Sign In">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- Collapsed State Profile -->
    <div class="d-flex justify-content-center" *ngIf="isSidebarCollapsed">
      <div class="user-avatar rounded-circle d-flex align-items-center justify-content-center text-xs font-bold text-white bg-primary" style="cursor: pointer;" [title]="userDisplayName">
        {{ userInitials }}
      </div>
    </div>
  </div>
</div>
