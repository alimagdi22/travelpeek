<section class="curated-for-you-v2-section">
  <div class="container px-4">
    <!-- Header with title and View All link -->
    <div class="row align-items-center justify-content-between mb-4">
      <div class="col-auto">
        <h2 class="section-title-v2">Curated for you</h2>
      </div>
      <div class="col-auto">
        <a href="#" class="view-all-link-v2">View all &rsaquo;</a>
      </div>
    </div>

    <!-- Cards Grid / Slider -->
    <div class="slider-wrapper position-relative">
      <div class="row g-4 slider-container" #slider>
        <div *ngFor="let dest of destinations" class="col-xl-3 col-lg-6 col-md-6 col-sm-12 slider-item">
          <div class="destination-card-v2 position-relative overflow-hidden rounded-4">
            <!-- Card Background Image -->
            <img [src]="dest.image" [alt]="dest.name" class="card-bg-v2" />

            <!-- Price Tag Badge (Top Right) -->
            <div class="price-tag-v2">{{ dest.price }}</div>

            <!-- Gradient Overlay -->
            <div class="card-overlay-v2 d-flex flex-column justify-content-end p-4">
              <h3 class="destination-name-v2 mb-1">{{ dest.name }}</h3>
              <p class="destination-meta-v2 mb-0">{{ dest.country }} &bull; {{ dest.dates }}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Floating Slider Navigation Arrows (Mobile/Tablet only) -->
      <button class="slider-arrow-btn prev" (click)="scrollSlider(slider, 'left')" aria-label="Previous slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button class="slider-arrow-btn next" (click)="scrollSlider(slider, 'right')" aria-label="Next slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </div>
</section>
