<section class="beach-escapes-v2-section">
  <div class="container px-4">
    <!-- Header with title and See All link -->
    <div class="row align-items-center justify-content-between mb-4">
      <div class="col-auto">
        <h2 class="section-title-v2 mb-0">Beach Escapes</h2>
      </div>
      <div class="col-auto">
        <a href="#" class="view-all-link-v2">See all &rsaquo;</a>
      </div>
    </div>

    <!-- Cards Grid / Slider -->
    <div class="slider-wrapper position-relative">
      <div class="row g-4 slider-container" #slider>
        <div *ngFor="let escape of escapes" class="col-lg-6 col-md-12 slider-item">
          <div class="escape-card-v2 position-relative overflow-hidden rounded-4">
            <!-- Card Background Image -->
            <img [src]="escape.image" [alt]="escape.name" class="card-bg-v2" />

            <!-- Gradient Overlay & Content Row -->
            <div class="card-overlay-v2 d-flex align-items-end justify-content-between p-4 p-md-5">
              <!-- Left Info -->
              <div class="escape-info-v2 text-white">
                <h3 class="escape-name-v2 mb-2">{{ escape.name }}</h3>
                <p class="escape-desc-v2 mb-0">{{ escape.description }}</p>
              </div>

              <!-- Right Price Card Overlay -->
              <div class="price-overlay-card-v2 d-flex flex-column align-items-center justify-content-center p-3 text-center">
                <span class="starting-label-v2 mb-1">Starting at</span>
                <span class="price-val-v2">{{ escape.price }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Floating Slider Navigation Arrows (Mobile/Tablet only) -->
      <button class="slider-arrow-btn prev" (click)="scrollSlider(slider, 'left')" aria-label="Previous slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button class="slider-arrow-btn next" (click)="scrollSlider(slider, 'right')" aria-label="Next slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </div>
</section>
