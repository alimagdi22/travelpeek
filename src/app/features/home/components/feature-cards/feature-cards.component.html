<section class="feature-cards-section">
  <div class="container px-4">
    <!-- Grid of 3 white cards -->
    <div class="row g-4">
      <div *ngFor="let feat of features" class="col-lg-4 col-md-6 col-sm-12 d-flex">
        <div class="feature-card-v2 w-100 p-5 rounded-4 bg-white d-flex flex-column align-items-start">
          <!-- Top Left Icon Container -->
          <div class="feature-icon-wrapper-v2 mb-4 d-flex align-items-center justify-content-center">
            <!-- Inline SVGs corresponding to the icons in /assets/icons/home/last/ -->
            <ng-container [ngSwitch]="feat.iconName">

          </div>

          <!-- Feature Title -->
          <h3 class="feature-title-v2 mb-2">{{ feat.title }}</h3>

          <!-- Feature Paragraph -->
          <p class="feature-description-v2 mb-0">{{ feat.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
