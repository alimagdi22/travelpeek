<section class="hero-section">
  <div class="hero-content text-center">
    <!-- Main Title -->
    <h1 class="hero-title">Where to next?</h1>

    <!-- Subtitle -->
    <p class="hero-subtitle">Just tell Peek what you're looking for.</p>

    <!-- Search Input Bar -->
    <div class="search-container mx-auto">
      <div class="search-bar d-flex align-items-center">
        <!-- Sparkle/Stars Icon -->
        <img src="/assets/icons/home/hero-section/stars.svg" class="stars-svg" alt="Sparkle Stars" />

        <!-- Input field -->
        <input
          type="text"
          class="search-input col"
          placeholder="I want a quiet beach with clear water in October..."
          [(ngModel)]="searchQuery"
          (keydown.enter)="performSearch()"
        />

        <!-- Search Button -->
        <button class="btn-search-action d-flex align-items-center justify-content-center" (click)="performSearch()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Recommendation Pills -->
    <div class="recommendations-container d-flex flex-wrap justify-content-center gap-3">
      <button class="rec-pill" (click)="performSearch('Surfing in Portugal')">"Surfing in Portugal"</button>
      <button class="rec-pill" (click)="performSearch('Family cabins in Norway')">"Family cabins in Norway"</button>
      <button class="rec-pill" (click)="performSearch('Tuscany wine tour')">"Tuscany wine tour"</button>
    </div>
  </div>
</section>
