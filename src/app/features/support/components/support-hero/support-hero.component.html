<section class="support-hero">
  <div class="container text-center">
    <h1 class="hero-title">How can we help?</h1>
    <p class="hero-subtitle">
      Instant answers for your travel plans, AI-guided discovery, and human-led support.
    </p>

    <!-- Search bar -->
    <div class="search-container mx-auto">
      <div class="search-bar d-flex align-items-center">
        <!-- Search icon -->
        <span class="search-icon d-flex align-items-center justify-content-center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z" stroke="#004ac6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        
        <!-- Input field -->
        <input 
          type="text" 
          class="search-input col" 
          placeholder="Search help articles, bookings, or policies..." 
        />
      </div>
    </div>
  </div>
</section>
