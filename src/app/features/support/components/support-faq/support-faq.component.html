<div class="faq-wrapper">
  <h2 class="section-title">{{ 'SUPPORT.FAQ' | translate }}</h2>

  <div class="faq-list d-flex flex-column gap-3">
    <!-- FAQ 1 -->
    <div class="faq-item" [class.active]="activeIndex === 0">
      <button class="faq-header w-100 d-flex align-items-center justify-content-between text-start" (click)="toggleFaq(0)">
        <span class="faq-question">{{ 'SUPPORT.FAQ1_Q' | translate }}</span>
        <span class="faq-arrow d-flex align-items-center justify-scale-center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9L12 15L18 9" stroke="#004ac6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
      <div class="faq-body">
        <p class="faq-answer">
          {{ 'SUPPORT.FAQ1_A' | translate }}
        </p>
      </div>
    </div>

    <!-- FAQ 2 -->
    <div class="faq-item" [class.active]="activeIndex === 1">
      <button class="faq-header w-100 d-flex align-items-center justify-content-between text-start" (click)="toggleFaq(1)">

            <path d="M6 9L12 15L18 9" stroke="#004ac6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
      <div class="faq-body">
        <p class="faq-answer">
          {{ 'SUPPORT.FAQ2_A' | translate }}
        </p>
      </div>
    </div>

    <!-- FAQ 3 -->
    <div class="faq-item" [class.active]="activeIndex === 2">
      <button class="faq-header w-100 d-flex align-items-center justify-content-between text-start" (click)="toggleFaq(2)">
        <span class="faq-question">{{ 'SUPPORT.FAQ3_Q' | translate }}</span>
        <span class="faq-arrow d-flex align-items-center justify-scale-center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9L12 15L18 9" stroke="#004ac6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>

      </button>
      <div class="faq-body">
        <p class="faq-answer">
          {{ 'SUPPORT.FAQ3_A' | translate }}
        </p>
      </div>
    </div>
  </div>
</div>
