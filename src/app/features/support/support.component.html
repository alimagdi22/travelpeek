<!-- Hero Header Section -->

<main class="support-main py-5">

    <div class="row g-5">
      <!-- Sidebar section (Left: 3 columns) -->
      <aside class="col-lg-3 col-md-4">
        <app-support-sidebar></app-support-sidebar>
      </aside>

      <!-- Main topics and FAQ area (Right: 9 columns) -->

        <app-support-topics></app-support-topics>
        <app-support-faq class="mt-5 d-block"></app-support-faq>
      </section>
    </div>

    <!-- Bottom contact banner -->
    <div class="row mt-5">
      <div class="col-12">
        <app-support-footer-banner></app-support-footer-banner>
      </div>
    </div>
