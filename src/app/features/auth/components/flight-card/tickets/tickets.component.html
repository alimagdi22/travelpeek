<article class="p-4 rounded-4 bg-white text-center shadow">
  <img src="assets/icons/userPage/ticket-icon.svg" title="Ticket Icon" width="50" class="mb-3" />

  <div class="mb-4">
    <p class="h4 text-center font-weight-bold mb-3 text-dark">Tickets</p>
    <div class="ticket-numbers-list d-flex flex-column gap-2 overflow-auto" style="max-height: 150px;">
      <p class="font-monospace text-secondary mb-0 py-1 border-bottom" *ngFor="let ticket of tickets">
        {{ ticket.ticketNumber ?? '' }}
      </p>
    </div>
  </div>

  <div class="d-flex gap-3 justify-content-center">
    <button class="btn-cancel" (click)="onClickCancel()">Cancel</button>
  </div>
</article>

<div class="background" (click)="onClickCancel()"></div>
