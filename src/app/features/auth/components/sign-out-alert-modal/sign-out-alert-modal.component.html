<article class="p-4 rounded-4 bg-white text-center shadow">
  <img src="assets/icons/userPage/warning-icon.svg" title="Warning Icon" width="50" class="mb-3" />

  <div class="mb-4">
    <p class="title h4 mb-2 font-weight-bold">{{ 'AUTH.SIGN_OUT' | translate }}</p>
    <p class="text-muted mb-0">{{ 'AUTH.SIGN_OUT_CONFIRM' | translate }}</p>
  </div>

  <div class="actions d-flex gap-3 justify-content-center">
    <button class="btn-signout" (click)="onClickSignOut()">{{ 'AUTH.SIGN_OUT' | translate }}</button>
    <button class="btn-cancel" (click)="onClickCancel()">{{ 'COMMON.CANCEL' | translate }}</button>
  </div>
</article>

<div class="background" (click)="onClickCancel()"></div>
