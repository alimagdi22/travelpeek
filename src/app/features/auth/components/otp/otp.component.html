<div class="otp-form-container text-center">
  <h1 class="welcome-title mb-2">Verify email</h1>
  <p class="welcome-subtitle mb-4" *ngIf="email">
    We sent a verification code to <strong>{{ email }}</strong>. Enter it below to join Peek.
  </p>
  <p class="welcome-subtitle mb-4" *ngIf="!email">
    We sent a verification code to your email. Enter it below to join Peek.
  </p>

  <!-- Alert Message Banner -->
  <div class="error-banner mb-4 d-flex align-items-start gap-2 text-start" *ngIf="errorMessage">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span>{{ errorMessage }}</span>
  </div>

  <form (submit)="onSubmitOtp(); $event.preventDefault();" class="d-flex flex-column gap-3">
    <!-- OTP Code Input -->
    <div class="form-group d-flex flex-column text-start">
      <label for="otpCode" class="form-label text-center">Verification Code</label>
      <input
        id="otpCode"
        type="text"
        [formControl]="otpControl"
        class="login-input otp-input text-center"
        placeholder="000000"
        maxlength="10"
        required
        autocomplete="one-time-code"
      />
    </div>

    <!-- Submit OTP Button -->
    <button
      type="submit"
      class="btn-login-submit py-3 mt-2 d-flex align-items-center justify-content-center gap-2 text-white"
      [disabled]="authService.isLoading || !otpControl.value || !otpControl.value.trim()"
    >
      <span *ngIf="authService.isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      {{ authService.isLoading ? 'Verifying...' : 'Verify & Join' }}
    </button>

    <!-- Resend Code -->
    <p class="signup-prompt mt-2 mb-0">
      Didn't receive the code? <span class="signup-link" style="cursor: pointer;" (click)="onResendOtp()">Resend code</span>
    </p>
  </form>
</div>
