<div class="email-form-container text-start">
  <!-- Back navigation button -->
  <button type="button" class="btn-back mb-4 d-inline-flex align-items-center gap-2" (click)="goBackToOptions()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Back
  </button>

  <h1 class="welcome-title mb-2 text-center">Welcome back</h1>
  <p class="welcome-subtitle mb-4 text-center">
    Enter your details to log in to your account.
  </p>

  <!-- Alert Message Banner -->
  <div class="error-banner mb-4 d-flex align-items-start gap-2" *ngIf="errorMessage">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span>{{ errorMessage }}</span>
  </div>

  <form [formGroup]="authService.loginForm" (ngSubmit)="onSubmitForm()" class="d-flex flex-column gap-3">
    <!-- Email Input Group -->
    <div class="form-group d-flex flex-column">
      <label for="email" class="form-label">Email address</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="login-input"
        [class.is-invalid]="authService.loginForm.get('email')?.touched && authService.loginForm.get('email')?.invalid"
        placeholder="name@example.com"
        autocomplete="email"
      />
      <div class="invalid-feedback" *ngIf="authService.loginForm.get('email')?.touched && authService.loginForm.get('email')?.invalid">
        {{ getEmailError() }}
      </div>
    </div>

    <!-- Password Input Group -->
    <div class="form-group d-flex flex-column mb-2">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <label for="password" class="form-label mb-0">Password</label>
        <a class="forgot-password-link">Forgot password?</a>
      </div>
      <div class="password-input-wrapper position-relative w-100">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          class="login-input pe-5"
          [class.is-invalid]="authService.loginForm.get('password')?.touched && authService.loginForm.get('password')?.invalid"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
        <button type="button" class="btn-toggle-password" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
          <!-- Eye open icon (show password) -->
          <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <!-- Eye off icon (hide password) -->
          <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
      <div class="invalid-feedback" *ngIf="authService.loginForm.get('password')?.touched && authService.loginForm.get('password')?.invalid">
        {{ getPasswordError() }}
      </div>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      class="btn-login-submit py-3 mt-2 d-flex align-items-center justify-content-center gap-2 text-white"
      [disabled]="authService.isLoading || authService.loginForm.invalid"
    >
      <span *ngIf="authService.isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      {{ authService.isLoading ? 'Logging in...' : 'Log in' }}
    </button>
  </form>
</div>

<!-- Footnote signup -->
<p class="signup-prompt mt-4 mb-0 text-center">
  Don't have an account? <span class="signup-link" style="cursor: pointer;" (click)="onJoinPeek()">Join Peek</span>
</p>
