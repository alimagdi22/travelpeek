<div>
  <h1 class="welcome-title mb-2">Welcome back</h1>
  <p class="welcome-subtitle mb-4">
    Choose your preferred login method to continue planning your trip.
  </p>

  <!-- Social Action Buttons -->
  <div class="social-buttons d-flex flex-column gap-3 mb-4">
    <!-- Google -->
    <button class="btn-social btn-google d-flex align-items-center justify-content-center gap-3" (click)="onSocialLogin('Google')">
      <!-- Colored Google G icon -->
      <svg width="18" height="18" viewBox="0 0 48 48" class="social-icon">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24c0-1.63-.15-3.2-.43-4.75H24v9h12.75c-.55 2.87-2.17 5.3-4.61 6.93l7.2 5.58C43.55 36.67 46.5 30.82 46.5 24z"/>
        <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
        <path fill="#34A853" d="M24 38.5c-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48c6.48 0 11.93-2.13 15.89-5.81l-7.2-5.58c-2.11 1.41-4.8 2.25-7.69 2.25z"/>
      </svg>
      Continue with Google
    </button>

    <!-- Apple -->
    <button class="btn-social btn-apple d-flex align-items-center justify-content-center gap-3 text-white" (click)="onSocialLogin('Apple')">
      <!-- White Apple icon -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="social-icon">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.22.67-2.94 1.51-.62.72-1.16 1.86-1.01 2.97 1.11.09 2.27-.58 2.96-1.42z"/>
      </svg>
      Continue with Apple
    </button>

    <!-- Facebook -->
    <button class="btn-social btn-facebook d-flex align-items-center justify-content-center gap-3 text-white" (click)="onSocialLogin('Facebook')">
      <!-- White Facebook icon -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="social-icon">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      Continue with Facebook
    </button>
  </div>

  <!-- Divider -->
  <div class="divider-row d-flex align-items-center justify-content-center my-4">
    <span class="divider-line flex-grow-1"></span>
    <span class="divider-text px-3">OR</span>
    <span class="divider-line flex-grow-1"></span>
  </div>

  <!-- Email option -->
  <button class="btn-email-link py-2" (click)="onEmailLogin()">
    Continue with email
  </button>
</div>

<!-- Footnote signup -->
<p class="signup-prompt mt-4 mb-0 text-center">
  Don't have an account? <span class="signup-link" style="cursor: pointer;" (click)="onJoinPeek()">Join Peek</span>
</p>
