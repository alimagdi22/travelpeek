<main class="login-main d-flex flex-column align-items-center justify-content-center min-vh-100 py-5">
  <!-- Top Brand Name -->
  <div class="brand-header mb-4" routerLink="/" style="cursor: pointer;">
    <span class="logo-text">Peek</span>
  </div>

  <!-- Central Card Wrapper -->
  <div class="login-card p-4 p-md-5 rounded-4 shadow-sm text-center mb-4">
    <!-- Child auth components (Social, Login, Register, Otp) are rendered here -->
    <router-outlet></router-outlet>
  </div>

  <!-- Small Legal Disclaimers -->
  <p class="legal-footnote px-3 text-center mb-0">
    {{ 'AUTH.AGREE_PREFIX' | translate }}
    <a routerLink="/legal/terms-of-service" class="footnote-link">{{ 'AUTH.TERMS' | translate }}</a>
    {{ 'AUTH.ACKNOWLEDGE' | translate }}
    <a routerLink="/legal/privacy-policy" class="footnote-link">{{ 'AUTH.PRIVACY' | translate }}</a>.
  </p>
</main>
