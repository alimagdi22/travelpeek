<footer class="footer mb-2">
  <div class="container px-4 py-4">
    <div class="row align-items-center justify-content-between g-3">
      <!-- Left side: brand and copyright (Desktop) -->
      <div class="col-md-auto d-flex flex-column align-items-center align-items-md-start gap-1">
        <div class="brand" routerLink="/">
          <img src="assets/images/logo.png" [alt]="'FOOTER.LOGO_ALT' | translate">
        </div>
        <span class="copyright d-none d-md-block">{{ 'FOOTER.COPYRIGHT' | translate }}</span>
      </div>

      <!-- Right side: footer nav links -->
      <div class="col-md-auto d-flex justify-content-center justify-content-md-end">
        <nav class="footer-nav d-flex flex-wrap justify-content-center align-items-center gap-3 gap-md-4">
          <a
            routerLink="/legal/privacy-policy"
            routerLinkActive="active"
            class="footer-link"
            >{{ 'FOOTER.PRIVACY' | translate }}</a
          >
          <a
            routerLink="/legal/terms-of-service"
            routerLinkActive="active"
            class="footer-link"
            >{{ 'FOOTER.TERMS' | translate }}</a
          >
          <a
            routerLink="/legal/cookie-policy"
            routerLinkActive="active"
            class="footer-link"
            >{{ 'FOOTER.COOKIES' | translate }}</a
          >
          <a routerLink="/support" routerLinkActive="active" class="footer-link"
            >{{ 'FOOTER.CONTACT' | translate }}</a
          >
        </nav>
      </div>

      <!-- Bottom copyright (Mobile only) -->
      <div class="col-12 d-block d-md-none text-center mt-2">
        <span class="copyright">{{ 'FOOTER.COPYRIGHT' | translate }}</span>
      </div>
    </div>
  </div>
</footer>
