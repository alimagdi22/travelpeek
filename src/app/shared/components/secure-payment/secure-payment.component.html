<div class="secure-payment-card p-4 shadow-sm">
  <!-- Header -->
  <div class="secure-payment-header d-flex align-items-center gap-2 mb-3">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#004ac6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-icon">
      <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
      <line x1="1" y1="10" x2="23" y2="10"></line>
      <circle cx="6" cy="15" r="2"></circle>
    </svg>
    <h2 class="header-title mb-0">Secure Payment</h2>
  </div>

  <!-- Total Amount Row -->
  <div class="amount-box d-flex align-items-center justify-content-between p-3 px-4 mb-4">
    <span class="amount-label text-muted">Total Amount</span>
    <span class="amount-value">{{ amount | number: "1.0-0" }} <span class="currency">{{ currency }}</span></span>
  </div>

  <!-- Select Payment Method Selection -->
  <div class="payment-method-section mb-4">
    <span class="section-label d-block mb-2.5">SELECT PAYMENT METHOD</span>
    <div class="payment-buttons d-flex gap-3">
      <!-- Visa / MC Button -->
      <button 
        class="payment-btn flex-grow-1 d-flex align-items-center justify-content-center gap-2 px-3 py-2.5 rounded-3"
        [class.selected]="selectedMethod === 'card'"
        (click)="selectMethod('card')"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
        Visa / MC
      </button>

      <!-- Apple Pay Button -->
      <button 
        class="payment-btn flex-grow-1 d-flex align-items-center justify-content-center gap-2 px-3 py-2.5 rounded-3"
        [class.selected]="selectedMethod === 'applepay'"
        (click)="selectMethod('applepay')"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
          <rect x="8" y="6" width="8" height="8" rx="1"></rect>
        </svg>
        Apple Pay
      </button>
    </div>
  </div>

  <!-- Complete Payment Button -->
  <button class="btn btn-complete-payment w-100 font-semibold mb-4" (click)="completePayment()">
    Complete Payment
  </button>

  <!-- Footer Disclaimer -->
  <div class="secure-payment-footer d-flex align-items-start gap-2">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5c6479" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="footer-icon mt-0.5">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <span class="footer-text">
      Your payment is secure and encrypted. We use industry-standard security protocols to protect your data.
    </span>
  </div>
</div>
